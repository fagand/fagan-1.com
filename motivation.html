<!DOCTYPE HTML>
<html lang="en">

<head>

    <!-- Favicon -->
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon/favicon-16x16.png">
    <link rel="manifest"     href="/favicon/site.webmanifest">
    <link rel="mask-icon"    href="/favicon/safari-pinned-tab.svg" color="#ccff00">
    <link rel="shortcut icon" href="/favicon/favicon.ico">
    <meta name="theme-color" content="#000">

    <style>
        /* ============================================================
           MOTIVATION — full-bleed cinema mode.
           The video IS the page; nav and controls live on overlays
           that materialise when the cursor comes near them (top or
           bottom edge), or on tap for touch devices.
           ============================================================ */
        :root {
            --accent:    #ccff00;
            --text-dim:  rgba(255, 255, 255, 0.45);
            --font-mono: ui-monospace, 'SF Mono', 'Cascadia Code', 'JetBrains Mono',
                         Menlo, Consolas, monospace;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            height: 100%;
            background: #000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display',
                         'Segoe UI', system-ui, sans-serif;
            -webkit-font-smoothing: antialiased;
            overflow: hidden;   /* the video is the page — nothing scrolls */
        }

        /* ---- full-viewport stage ---- */
        .stage {
            position: fixed;
            inset: 0;
        }
        .stage.hide-cursor { cursor: none; }

        .stage video {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;      /* fill the page, crop as needed */
            opacity: 0;
            transition: opacity 0.5s ease;
        }
        .stage video.live { opacity: 1; }

        /* ============================================================
           OVERLAYS — hidden by default, slide in from their edge.
           .show is applied by the proximity/touch logic.
           ============================================================ */
        .ov {
            position: fixed;
            left: 0; right: 0;
            z-index: 5;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.35s ease, transform 0.45s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .ov.show {
            opacity: 1;
            pointer-events: auto;
            transform: none !important;
        }

        /* --- top: nav --- */
        .ov-top {
            top: 0;
            transform: translateY(-14px);
            padding: 18px max(20px, 4vw) 46px;
            background: linear-gradient(to bottom,
                rgba(0, 0, 0, 0.78) 0%, rgba(0, 0, 0, 0.35) 55%, transparent);
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .ov-top .brand {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            font-family: var(--font-mono);
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: var(--accent);
            text-decoration: none;
        }
        .ov-top .brand::before {
            content: '';
            width: 6px; height: 6px;
            border-radius: 50%;
            background: var(--accent);
            box-shadow: 0 0 8px rgba(204, 255, 0, 0.9);
        }

        .ov-top nav {
            display: flex;
            gap: 2px;
            margin-left: auto;
            overflow-x: auto;
            scrollbar-width: none;
        }
        .ov-top nav::-webkit-scrollbar { display: none; }

        .ov-top nav a {
            font-family: var(--font-mono);
            font-size: 11px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.55);
            text-decoration: none;
            padding: 7px 12px;
            border-radius: 8px;
            white-space: nowrap;
            transition: color 0.2s, background 0.2s;
        }
        .ov-top nav a:hover { color: #fff; background: rgba(255, 255, 255, 0.08); }
        .ov-top nav a.active {
            color: var(--accent);
            text-shadow: 0 0 14px rgba(204, 255, 0, 0.4);
        }

        /* --- bottom: control deck --- */
        .ov-bottom {
            bottom: 0;
            transform: translateY(14px);
            padding: 60px max(20px, 4vw) 22px;
            background: linear-gradient(to top,
                rgba(0, 0, 0, 0.82) 0%, rgba(0, 0, 0, 0.38) 55%, transparent);
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .deck-btn {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 9px 18px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(204, 255, 0, 0.3);
            border-radius: 100px;
            color: var(--accent);
            font-family: var(--font-mono);
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            cursor: pointer;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            transition: background 0.25s, border-color 0.25s, color 0.2s;
        }
        .deck-btn:hover {
            background: rgba(204, 255, 0, 0.14);
            border-color: rgba(204, 255, 0, 0.55);
            color: #fff;
        }
        .deck-btn:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        .deck-meta {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 16px;
            font-family: var(--font-mono);
            font-size: 11px;
            letter-spacing: 0.12em;
            color: var(--text-dim);
        }
        .deck-meta .clock { font-variant-numeric: tabular-nums; color: rgba(255,255,255,0.75); }
        .deck-meta .count { color: rgba(204, 255, 0, 0.65); }

        .page-tag {
            font-family: var(--font-mono);
            font-size: 10px;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--text-dim);
            flex-basis: 100%;
            margin-bottom: 2px;
        }
        .page-tag em { color: var(--accent); font-style: normal; }

        /* --- progress: always visible, hugs the bottom edge --- */
        .progress-track {
            position: fixed;
            left: 0; right: 0; bottom: 0;
            height: 3px;
            z-index: 6;
            background: rgba(255, 255, 255, 0.10);
        }
        .progress-fill {
            height: 100%;
            width: 100%;
            background: var(--accent);
            box-shadow: 0 0 10px rgba(204, 255, 0, 0.8);
            transform: scaleX(0);
            transform-origin: left;
        }

        /* --- centre: tap to play (autoplay blocked / reduced motion) --- */
        .play-overlay {
            position: fixed;
            inset: 0;
            z-index: 7;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.45);
            border: none;
            width: 100%;
            cursor: pointer;
        }
        .play-overlay.show { display: flex; }
        .play-overlay span {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-family: var(--font-mono);
            font-size: 12px;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--accent);
            padding: 13px 28px;
            border: 1px solid rgba(204, 255, 0, 0.45);
            border-radius: 100px;
            background: rgba(0, 0, 0, 0.72);
            box-shadow: 0 0 34px rgba(204, 255, 0, 0.18);
        }

        /* ============================================================
           UNMUTE CUE — a soft "click for sound" nudge that floats in
           once the muted clip is playing, then bows out. Purely
           decorative (pointer-events:none), so a click lands on the
           video beneath it and unmutes as normal.
           ============================================================ */
        .unmute-cue {
            position: fixed;
            left: 50%;
            bottom: 19%;
            z-index: 4;                       /* under the HUD + progress bar */
            display: inline-flex;
            align-items: center;
            gap: 12px;
            padding: 11px 22px 11px 13px;
            border-radius: 100px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(204, 255, 0, 0.34);
            backdrop-filter: blur(16px) saturate(150%);
            -webkit-backdrop-filter: blur(16px) saturate(150%);
            box-shadow: 0 10px 44px rgba(0, 0, 0, 0.55),
                        0 0 30px rgba(204, 255, 0, 0.10);
            color: var(--accent);
            font-family: var(--font-mono);
            font-size: 12px;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            white-space: nowrap;
            pointer-events: none;
            opacity: 0;
            transform: translate(-50%, 14px);
            transition: opacity 0.6s ease, transform 0.7s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .unmute-cue.show {
            opacity: 1;
            transform: translate(-50%, 0);
            animation: cue-bob 3.4s ease-in-out infinite 0.7s;
        }

        /* round icon badge with pulsing sonar rings */
        .unmute-badge {
            position: relative;
            width: 30px;
            height: 30px;
            display: grid;
            place-items: center;
            flex-shrink: 0;
        }
        .unmute-badge svg {
            position: relative;
            z-index: 1;
            width: 17px;
            height: 17px;
            fill: var(--accent);
            filter: drop-shadow(0 0 5px rgba(204, 255, 0, 0.55));
        }
        .unmute-ring {
            position: absolute;
            inset: 2px;
            border-radius: 50%;
            border: 1px solid rgba(204, 255, 0, 0.55);
            opacity: 0;
        }
        .unmute-cue.show .unmute-ring { animation: cue-ripple 2.4s ease-out infinite; }
        .unmute-cue.show .unmute-ring:nth-child(2) { animation-delay: 1.2s; }

        @keyframes cue-ripple {
            0%   { transform: scale(0.55); opacity: 0.85; }
            80%  { opacity: 0; }
            100% { transform: scale(2.4);  opacity: 0; }
        }
        @keyframes cue-bob {
            0%, 100% { transform: translate(-50%, 0); }
            50%      { transform: translate(-50%, -5px); }
        }

        @media (max-width: 640px) {
            .ov-top { padding: 14px 16px 40px; }
            .ov-bottom { padding: 52px 16px 18px; gap: 8px; }
            .deck-btn { padding: 8px 14px; }
            .deck-meta { gap: 10px; }
            .unmute-cue { bottom: 24%; font-size: 11px; padding: 10px 18px 10px 12px; }
        }

        @media (prefers-reduced-motion: reduce) {
            .ov { transition: none; }
            .stage video { transition: none; }
            .unmute-cue { transition: opacity 0.3s ease; }
            .unmute-cue.show { animation: none; transform: translate(-50%, 0); }
            .unmute-cue.show .unmute-ring { animation: none; opacity: 0.5; }
        }
    </style>
</head>

<body>

    <div class="stage" id="stage">
        <video id="vidA" playsinline muted preload="auto"></video>
        <video id="vidB" playsinline muted preload="none"></video>
    </div>

    <!-- top overlay: nav -->
    <header class="ov ov-top" id="ov-top">
        <a href="/index.html" class="brand">Fagan-1.com</a>
        <nav>
            <a href="/index.html">Home</a>
            <a href="/mixtapes/">The Mixtapes</a>
            <a href="/mixtapes/tracklist/">Track-lists</a>
            <a href="/mixtapes/archive/">Archive</a>
            <a href="/motivation.html" class="active">Motivation</a>
        </nav>
    </header>

    <!-- bottom overlay: controls -->
    <div class="ov ov-bottom" id="ov-bottom">
        <span class="page-tag"><em>Motivation</em> &middot; one random clip &middot; no algorithm &middot; click to unmute</span>
        <button class="deck-btn" id="btn-play" aria-label="Pause">&#10074;&#10074; Pause</button>
        <button class="deck-btn" id="btn-mute" aria-label="Turn sound on">&#128263; Sound on</button>
        <button class="deck-btn" id="btn-next" aria-label="Next clip">Next &#9654;</button>
        <div class="deck-meta">
            <span class="clock" id="clock">0:00 / 0:00</span>
            <span class="count" id="count">&ndash; / &ndash;</span>
        </div>
    </div>

    <button class="play-overlay" id="play-overlay" aria-label="Play video">
        <span>&#9654; Tap to play</span>
    </button>

    <!-- "click for sound" nudge (shown once, over the muted clip) -->
    <div class="unmute-cue" id="unmute-cue" aria-hidden="true">
        <span class="unmute-badge">
            <span class="unmute-ring"></span>
            <span class="unmute-ring"></span>
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4.03v8.05A4.5 4.5 0 0 0 16.5 12zM14 3.23v2.06a7 7 0 0 1 0 13.42v2.06a9 9 0 0 0 0-17.54z"/>
            </svg>
        </span>
        <span class="unmute-label">Click for sound</span>
    </div>

    <div class="progress-track" aria-hidden="true">
        <div class="progress-fill" id="progress"></div>
    </div>

    <noscript>
        <div style="position:fixed; inset:0; z-index:20; background:#000; padding:20px; overflow:auto;">
            <p style="margin:0 0 12px; font-family:var(--font-mono); color:#ccff00;">
                JavaScript is off — here's a clip the old-fashioned way:
                <a href="/index.html" style="color:#fff;">back home</a></p>
            <video src="/assets/vids/motiv-01.mp4" poster="/assets/vids/motiv-01.jpg"
                   controls playsinline style="width:100%; max-height:80vh;"></video>
        </div>
    </noscript>

    <script>
    (function () {
        'use strict';

        /* The clip list between the two BUILD:CLIPS markers is rewritten
           automatically by assets/vids/build.sh — don't hand-edit it. */
        var CLIPS = [
            /* BUILD:CLIPS:START */
            { src: '/assets/vids/motiv-01.mp4', poster: '/assets/vids/motiv-01.jpg' },
            { src: '/assets/vids/motiv-02.mp4', poster: '/assets/vids/motiv-02.jpg' },
            { src: '/assets/vids/motiv-03.mp4', poster: '/assets/vids/motiv-03.jpg' },
            { src: '/assets/vids/motiv-04.mp4', poster: '/assets/vids/motiv-04.jpg' },
            { src: '/assets/vids/motiv-05.mp4', poster: '/assets/vids/motiv-05.jpg' },
            { src: '/assets/vids/motiv-06.mp4', poster: '/assets/vids/motiv-06.jpg' },
            { src: '/assets/vids/motiv-07.mp4', poster: '/assets/vids/motiv-07.jpg' },
            { src: '/assets/vids/motiv-08.mp4', poster: '/assets/vids/motiv-08.jpg' }
            /* BUILD:CLIPS:END */
        ];

        var vids     = [document.getElementById('vidA'), document.getElementById('vidB')];
        var stage    = document.getElementById('stage');
        var ovTop    = document.getElementById('ov-top');
        var ovBottom = document.getElementById('ov-bottom');
        var overlay  = document.getElementById('play-overlay');
        var progress = document.getElementById('progress');
        var clock    = document.getElementById('clock');
        var count    = document.getElementById('count');
        var btnPlay  = document.getElementById('btn-play');
        var btnMute  = document.getElementById('btn-mute');
        var btnNext  = document.getElementById('btn-next');
        var cue      = document.getElementById('unmute-cue');

        var reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        var coarse        = window.matchMedia('(pointer: coarse)').matches;
        var saveData      = navigator.connection && navigator.connection.saveData;

        /* ==========================================================
           PLAYER — shuffle bag + double buffer (standby element
           preloads the next clip so swaps are instant)
           ========================================================== */
        var order = CLIPS.map(function (_, i) { return i; });
        for (var i = order.length - 1; i > 0; i--) {
            var j = Math.floor(Math.random() * (i + 1));
            var t = order[i]; order[i] = order[j]; order[j] = t;
        }

        var pos = 0, live = 0, muted = true;

        function clip(p) { return CLIPS[order[((p % order.length) + order.length) % order.length]]; }

        function fmt(s) {
            if (!isFinite(s)) return '0:00';
            var m = Math.floor(s / 60), r = Math.floor(s % 60);
            return m + ':' + (r < 10 ? '0' : '') + r;
        }

        function preloadStandby() {
            if (saveData) return;
            var v = vids[1 - live];
            var c = clip(pos + 1);
            v.preload = 'auto';
            v.poster  = c.poster;
            v.src     = c.src;
            v.load();
        }

        function updateHud() {
            count.textContent = ((pos % order.length) + 1) + ' / ' + order.length;
            var v = vids[live];
            clock.textContent = fmt(v.currentTime) + ' / ' + fmt(v.duration);
        }

        function setPlayUi(playing) {
            btnPlay.innerHTML = playing ? '&#10074;&#10074; Pause' : '&#9654; Play';
            btnPlay.setAttribute('aria-label', playing ? 'Pause' : 'Play');
        }

        function setMuteUi() {
            btnMute.innerHTML = muted ? '&#128263; Sound on' : '&#128266; Sound off';
            btnMute.setAttribute('aria-label', muted ? 'Turn sound on' : 'Turn sound off');
        }

        /* ---- unmute cue: a one-time "click for sound" nudge ---- */
        var cueDone = false, cueTimer = null;
        if (cue) cue.querySelector('.unmute-label').textContent = coarse ? 'Tap for sound' : 'Click for sound';
        function showCue() {
            if (!cue || cueDone || !muted) return;
            cueDone = true;                       /* one graceful appearance only */
            cue.classList.add('show');
            cueTimer = setTimeout(hideCue, 7000); /* then it bows out on its own */
        }
        function hideCue() {
            if (!cue) return;
            cue.classList.remove('show');
            clearTimeout(cueTimer);
            cueDone = true;
        }

        function tryPlay(v) {
            v.muted = muted;   /* re-sync right before play — autoplay needs it true */
            var p = v.play();
            if (p && p.catch) {
                p.then(function () {
                    overlay.classList.remove('show');
                    setPlayUi(true);
                    if (muted) showCue();          /* nudge only while there's no sound */
                })
                 .catch(function () { overlay.classList.add('show'); setPlayUi(false); });
            }
        }

        function show(idx, autoplay) {
            var v = vids[idx], o = vids[1 - idx];
            v.classList.add('live');
            o.classList.remove('live');
            v.muted = muted;
            progress.style.transform = 'scaleX(0)';
            updateHud();
            if (autoplay) tryPlay(v);
            o.pause();
            preloadStandby();
        }

        function next() {
            pos++;
            var standby = 1 - live;
            var c = clip(pos);
            if (vids[standby].src.indexOf(c.src) === -1) {
                vids[standby].poster = c.poster;
                vids[standby].src    = c.src;
            }
            live = standby;
            show(live, true);
        }

        vids.forEach(function (v) {
            /* our muted state is authoritative — some environments reset
               the property, and autoplay depends on it being true */
            v.addEventListener('volumechange', function () {
                if (v.muted !== muted) v.muted = muted;
            });
            v.addEventListener('ended', function () {
                if (v === vids[live]) next();
            });
            /* keep the button label true even if the browser itself
               pauses/resumes playback (background tab, PiP, etc.) */
            v.addEventListener('play',  function () { if (v === vids[live]) setPlayUi(true);  });
            v.addEventListener('pause', function () { if (v === vids[live] && !v.ended) setPlayUi(false); });
            v.addEventListener('timeupdate', function () {
                if (v !== vids[live] || !isFinite(v.duration)) return;
                progress.style.transform = 'scaleX(' + (v.currentTime / v.duration) + ')';
                updateHud();
            });
            v.addEventListener('loadedmetadata', function () {
                if (v === vids[live]) updateHud();
            });
        });

        btnPlay.addEventListener('click', function () {
            var v = vids[live];
            if (v.paused) { tryPlay(v); } else { v.pause(); setPlayUi(false); }
        });

        function toggleMute() {
            muted = !muted;
            vids.forEach(function (v) { v.muted = muted; });
            setMuteUi();
            if (!muted) hideCue();   /* sound's on — retire the nudge */
        }
        btnMute.addEventListener('click', toggleMute);

        btnNext.addEventListener('click', next);
        overlay.addEventListener('click', function () { tryPlay(vids[live]); });

        document.addEventListener('keydown', function (e) {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
            if (e.code === 'Space')  { e.preventDefault(); btnPlay.click(); }
            else if (e.key === 'm')  { btnMute.click(); }
            else if (e.key === 'n')  { btnNext.click(); }
            reveal('both');          /* any key wakes the HUD */
        });

        document.addEventListener('visibilitychange', function () {
            var v = vids[live];
            if (document.hidden) { if (!v.paused) { v.pause(); v._wasPlaying = true; } }
            else if (v._wasPlaying) { v._wasPlaying = false; tryPlay(v); }
            /* opened in a background tab: start once the tab becomes visible */
            else if (!reducedMotion && v.paused && overlay.classList.contains('show')) tryPlay(v);
        });

        /* ==========================================================
           PROXIMITY HUD
           Desktop: each overlay materialises when the cursor enters
           its edge zone and dissolves when it leaves. The cursor
           itself hides after idling mid-screen.
           Touch: a tap summons both overlays; they sleep after 3.5s.
           Keyboard: focusing any control keeps its overlay awake.
           ========================================================== */
        var TOP_ZONE = 150, BOTTOM_ZONE = 200, IDLE_MS = 1800, TOUCH_MS = 3500;
        var hideTimer = { top: null, bottom: null }, cursorTimer = null;

        function reveal(which, sticky) {
            if (which === 'top' || which === 'both') wake(ovTop, 'top', sticky);
            if (which === 'bottom' || which === 'both') wake(ovBottom, 'bottom', sticky);
        }

        function wake(el, key, sticky) {
            el.classList.add('show');
            clearTimeout(hideTimer[key]);
            if (!sticky) hideTimer[key] = setTimeout(function () { sleep(el); }, coarse ? TOUCH_MS : IDLE_MS);
        }

        function sleep(el) {
            /* never hide an overlay the keyboard is inside */
            if (el.contains(document.activeElement)) return;
            /* keep controls up while paused — you're clearly fiddling */
            if (el === ovBottom && vids[live].paused) return;
            el.classList.remove('show');
        }

        if (reducedMotion) {
            /* no proximity games: HUD stays put */
            ovTop.classList.add('show');
            ovBottom.classList.add('show');
        } else if (coarse) {
            /* touch: tap the video to unmute (or mute) and summon the controls */
            stage.addEventListener('click', function () {
                toggleMute();
                reveal('both');
            });
        } else {
            /* desktop: edge proximity */
            window.addEventListener('mousemove', function (e) {
                var y = e.clientY, h = window.innerHeight;
                if (y < TOP_ZONE)          reveal('top', true);
                else if (ovTop.classList.contains('show')) wake(ovTop, 'top');       /* left the zone → start the clock */
                if (y > h - BOTTOM_ZONE)   reveal('bottom', true);
                else if (ovBottom.classList.contains('show')) wake(ovBottom, 'bottom');

                stage.classList.remove('hide-cursor');
                clearTimeout(cursorTimer);
                cursorTimer = setTimeout(function () {
                    /* only vanish the cursor when it's parked mid-screen */
                    if (y > TOP_ZONE && y < h - BOTTOM_ZONE) stage.classList.add('hide-cursor');
                }, 2600);
            }, { passive: true });

            /* click the video to unmute (or mute again) — sound button stays in sync */
            stage.addEventListener('click', function () {
                toggleMute();
                reveal('bottom');
            });
        }

        /* keyboard users: overlays wake when tabbed into and stay awake */
        [ovTop, ovBottom].forEach(function (el) {
            el.addEventListener('focusin',  function () { el.classList.add('show'); });
            el.addEventListener('focusout', function () {
                if (!reducedMotion) wake(el, el === ovTop ? 'top' : 'bottom');
            });
        });

        /* ---- boot ---- */
        vids.forEach(function (v) { v.muted = true; });
        var first = clip(0);
        vids[0].poster = first.poster;
        vids[0].src    = first.src;
        vids[0].classList.add('live');
        setMuteUi();
        updateHud();

        if (reducedMotion) {
            overlay.classList.add('show');
            setPlayUi(false);
        } else {
            tryPlay(vids[0]);
            reveal('both');   /* introduce the HUD once, then it sleeps */
        }
        preloadStandby();
    })();
    </script>

</body>
</html>
