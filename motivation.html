<!DOCTYPE HTML>
<html lang="en">

<head>
    <title>Motivation | fagan-1.com</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Experimental page — keep out of search until it graduates -->
    <meta name="robots" content="noindex">
    <meta name="author" content="David Fagan">
    <meta name="description" content="One random motivation clip. No algorithm.">
    <!-- Favicon -->
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon/favicon-16x16.png">
    <link rel="manifest"     href="/favicon/site.webmanifest">
    <link rel="mask-icon"    href="/favicon/safari-pinned-tab.svg" color="#ccff00">
    <link rel="shortcut icon" href="/favicon/favicon.ico">
    <meta name="theme-color" content="#000">
    <!-- Shared design system -->
    <link rel="stylesheet" href="/assets/css/site.css" />

    <style>
        /* ---- Player frame ---- */
        .player-card {
            padding: 0;
            opacity: 0;
            animation: fade-up 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.3s forwards;
        }

        /* Fixed-height stage: portrait and landscape clips letterbox inside it,
           so swapping videos never shifts the layout. */
        .player-stage {
            position: relative;
            width: 100%;
            height: clamp(380px, 68vh, 720px);
            background: #000;
            overflow: hidden;
            cursor: pointer;
        }

        .player-stage video {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            opacity: 0;
            transition: opacity 0.45s ease;
        }
        .player-stage video.live { opacity: 1; }

        /* Tap-to-play overlay — shown when autoplay is blocked or reduced motion */
        .play-overlay {
            position: absolute;
            inset: 0;
            z-index: 3;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.45);
            border: none;
            width: 100%;
            cursor: pointer;
        }
        .play-overlay.show { display: flex; }

        .play-overlay span {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-family: var(--font-mono);
            font-size: 12px;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--accent);
            padding: 12px 26px;
            border: 1px solid rgba(204, 255, 0, 0.45);
            border-radius: 100px;
            background: rgba(0, 0, 0, 0.72);
            box-shadow: 0 0 30px rgba(204, 255, 0, 0.18);
        }

        /* Thin progress bar along the bottom edge of the stage */
        .progress-track {
            position: absolute;
            left: 0; right: 0; bottom: 0;
            height: 2px;
            z-index: 2;
            background: rgba(255, 255, 255, 0.08);
        }
        .progress-fill {
            height: 100%;
            width: 100%;
            background: var(--accent);
            box-shadow: 0 0 8px rgba(204, 255, 0, 0.7);
            transform: scaleX(0);
            transform-origin: left;
        }

        /* ---- Control deck ---- */
        .deck {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            padding: 14px 18px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
        }

        .deck-btn {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 8px 16px;
            background: rgba(204, 255, 0, 0.06);
            border: 1px solid rgba(204, 255, 0, 0.24);
            border-radius: 100px;
            color: var(--accent);
            font-family: var(--font-mono);
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            cursor: pointer;
            transition: background 0.25s, border-color 0.25s, color 0.2s;
        }
        .deck-btn:hover {
            background: rgba(204, 255, 0, 0.13);
            border-color: rgba(204, 255, 0, 0.5);
            color: #fff;
        }
        .deck-btn:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        .deck-meta {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 16px;
            font-family: var(--font-mono);
            font-size: 11px;
            letter-spacing: 0.12em;
            color: var(--text-dim);
        }
        .deck-meta .clock  { font-variant-numeric: tabular-nums; }
        .deck-meta .count  { color: rgba(204, 255, 0, 0.6); }

        /* Muted badge pulses gently to invite the unmute tap */
        .deck-btn[data-muted="true"] {
            animation: nudge 2.6s ease-in-out infinite;
        }
        @keyframes nudge {
            0%, 100% { border-color: rgba(204, 255, 0, 0.24); }
            50%      { border-color: rgba(204, 255, 0, 0.6); }
        }

        /* Hint line under the card */
        .keys-hint {
            margin-top: 14px;
            font-family: var(--font-mono);
            font-size: 10px;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--text-dim);
            opacity: 0;
            animation: fade-in 1s ease 1.1s forwards;
        }
        .keys-hint kbd {
            font-family: inherit;
            color: rgba(204, 255, 0, 0.65);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 4px;
            padding: 1px 6px;
            margin: 0 2px;
        }

        @media (max-width: 640px) {
            .player-stage { height: clamp(320px, 58vh, 560px); }
            .deck { padding: 12px 14px; }
            .deck-meta { gap: 10px; }
            .keys-hint { display: none; }  /* no keyboard on touch */
        }

        @media (prefers-reduced-motion: reduce) {
            .page-hero, .player-card, .keys-hint {
                animation: none;
                opacity: 1;
            }
            .player-stage video { transition: none; }
            .deck-btn[data-muted="true"] { animation: none; }
        }
    </style>
</head>

<body>

    <!-- Header -->
    <header class="site-header">
        <a href="/index.html" class="brand">Fagan-1.com</a>
        <div class="sep"></div>
        <nav>
            <a href="/index.html">Home</a>
            <a href="/mixtapes/">The Mixtapes</a>
            <a href="/mixtapes/tracklist/">Track-lists</a>
            <a href="/mixtapes/archive/">Archive</a>
            <a href="/motivation.html" class="active">Motivation</a>
        </nav>
    </header>

    <main class="page-wrap">

        <div class="page-hero">
            <div class="kicker">Experiment 001 // Video</div>
            <h1>Daily <em>Motivation</em></h1>
            <p>One random clip. No algorithm.</p>
        </div>

        <div class="glass-card player-card">
            <div class="player-stage" id="stage">
                <video id="vidA" playsinline muted preload="auto"></video>
                <video id="vidB" playsinline muted preload="none"></video>
                <button class="play-overlay" id="play-overlay" aria-label="Play video">
                    <span>&#9654; Tap to play</span>
                </button>
                <div class="progress-track" aria-hidden="true">
                    <div class="progress-fill" id="progress"></div>
                </div>
            </div>
            <div class="deck">
                <button class="deck-btn" id="btn-play" aria-label="Pause">&#10074;&#10074; Pause</button>
                <button class="deck-btn" id="btn-mute" data-muted="true" aria-label="Turn sound on">&#128263; Sound on</button>
                <button class="deck-btn" id="btn-next" aria-label="Next clip">Next &#9654;</button>
                <div class="deck-meta">
                    <span class="clock" id="clock">0:00 / 0:00</span>
                    <span class="count" id="count">&ndash; / &ndash;</span>
                </div>
            </div>
        </div>

        <p class="keys-hint">
            <kbd>space</kbd> play &middot; <kbd>m</kbd> sound &middot; <kbd>n</kbd> next
        </p>

        <noscript>
            <div class="glass-card" style="padding:20px; margin-top:20px;">
                <p style="margin:0 0 12px;">JavaScript is off — here's a clip the old-fashioned way:</p>
                <video src="/assets/vids/motiv-01.mp4" poster="/assets/vids/motiv-01.jpg"
                       controls playsinline style="width:100%; max-height:70vh;"></video>
            </div>
        </noscript>

    </main>

    <script>
    (function () {
        'use strict';

        var CLIPS = [
            { src: '/assets/vids/motiv-01.mp4', poster: '/assets/vids/motiv-01.jpg' },
            { src: '/assets/vids/motiv-02.mp4', poster: '/assets/vids/motiv-02.jpg' },
            { src: '/assets/vids/motiv-03.mp4', poster: '/assets/vids/motiv-03.jpg' },
            { src: '/assets/vids/motiv-04.mp4', poster: '/assets/vids/motiv-04.jpg' },
            { src: '/assets/vids/motiv-05.mp4', poster: '/assets/vids/motiv-05.jpg' },
            { src: '/assets/vids/motiv-06.mp4', poster: '/assets/vids/motiv-06.jpg' },
            { src: '/assets/vids/motiv-07.mp4', poster: '/assets/vids/motiv-07.jpg' }
        ];

        var vids     = [document.getElementById('vidA'), document.getElementById('vidB')];
        var overlay  = document.getElementById('play-overlay');
        var progress = document.getElementById('progress');
        var clock    = document.getElementById('clock');
        var count    = document.getElementById('count');
        var btnPlay  = document.getElementById('btn-play');
        var btnMute  = document.getElementById('btn-mute');
        var btnNext  = document.getElementById('btn-next');
        var stage    = document.getElementById('stage');

        var reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        var saveData      = navigator.connection && navigator.connection.saveData;

        /* Shuffle bag: play all 7 in random order before any repeat */
        var order = CLIPS.map(function (_, i) { return i; });
        for (var i = order.length - 1; i > 0; i--) {
            var j = Math.floor(Math.random() * (i + 1));
            var t = order[i]; order[i] = order[j]; order[j] = t;
        }

        var pos    = 0;      /* index into order[] */
        var live   = 0;      /* which <video> is on screen */
        var muted  = true;

        function clip(p) { return CLIPS[order[((p % order.length) + order.length) % order.length]]; }

        function fmt(s) {
            if (!isFinite(s)) return '0:00';
            var m = Math.floor(s / 60), r = Math.floor(s % 60);
            return m + ':' + (r < 10 ? '0' : '') + r;
        }

        /* Double-buffer: the hidden element preloads the next clip while
           the visible one plays, so "next" swaps instantly. */
        function preloadStandby() {
            if (saveData) return;                 /* respect Data Saver */
            var v = vids[1 - live];
            var c = clip(pos + 1);
            v.preload = 'auto';
            v.poster  = c.poster;
            v.src     = c.src;
            v.load();
        }

        function updateHud() {
            count.textContent = ((pos % order.length) + 1) + ' / ' + order.length;
            var v = vids[live];
            clock.textContent = fmt(v.currentTime) + ' / ' + fmt(v.duration);
        }

        function tryPlay(v) {
            var p = v.play();
            if (p && p.catch) {
                p.then(function () { overlay.classList.remove('show'); setPlayUi(true); })
                 .catch(function () { overlay.classList.add('show');   setPlayUi(false); });
            }
        }

        function setPlayUi(playing) {
            btnPlay.innerHTML = playing ? '&#10074;&#10074; Pause' : '&#9654; Play';
            btnPlay.setAttribute('aria-label', playing ? 'Pause' : 'Play');
        }

        function setMuteUi() {
            btnMute.innerHTML = muted ? '&#128263; Sound on' : '&#128266; Sound off';
            btnMute.setAttribute('aria-label', muted ? 'Turn sound on' : 'Turn sound off');
            btnMute.setAttribute('data-muted', muted ? 'true' : 'false');
        }

        function show(idx, autoplay) {
            var v = vids[idx], o = vids[1 - idx];
            v.classList.add('live');
            o.classList.remove('live');
            v.muted = muted;
            progress.style.transform = 'scaleX(0)';
            updateHud();
            if (autoplay) tryPlay(v);
            /* pause + unload the off-screen element once the swap settles,
               then point it at the clip after this one */
            o.pause();
            preloadStandby();
        }

        function next() {
            pos++;
            var standby = 1 - live;
            var c = clip(pos);
            /* if the standby buffer wasn't prefetched (Data Saver), load now */
            if (vids[standby].src.indexOf(c.src) === -1) {
                vids[standby].poster = c.poster;
                vids[standby].src    = c.src;
            }
            live = standby;
            show(live, true);
        }

        /* ---- wire events on both buffers ---- */
        vids.forEach(function (v) {
            /* our `muted` state is authoritative — some environments reset
               the property, and autoplay depends on it being true */
            v.addEventListener('volumechange', function () {
                if (v.muted !== muted) v.muted = muted;
            });
            v.addEventListener('ended', function () {
                if (v === vids[live]) next();
            });
            v.addEventListener('timeupdate', function () {
                if (v !== vids[live] || !isFinite(v.duration)) return;
                progress.style.transform = 'scaleX(' + (v.currentTime / v.duration) + ')';
                updateHud();
            });
            v.addEventListener('loadedmetadata', function () {
                if (v === vids[live]) updateHud();
            });
        });

        btnPlay.addEventListener('click', function () {
            var v = vids[live];
            if (v.paused) { tryPlay(v); } else { v.pause(); setPlayUi(false); }
        });

        btnMute.addEventListener('click', function () {
            muted = !muted;
            vids.forEach(function (v) { v.muted = muted; });
            setMuteUi();
        });

        btnNext.addEventListener('click', next);

        overlay.addEventListener('click', function () { tryPlay(vids[live]); });

        stage.addEventListener('click', function (e) {
            if (e.target === overlay || overlay.contains(e.target)) return;
            var v = vids[live];
            if (v.paused) { tryPlay(v); } else { v.pause(); setPlayUi(false); }
        });

        document.addEventListener('keydown', function (e) {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
            if (e.code === 'Space')      { e.preventDefault(); btnPlay.click(); }
            else if (e.key === 'm')      { btnMute.click(); }
            else if (e.key === 'n')      { btnNext.click(); }
        });

        /* Pause when the tab is hidden; resume when it's back */
        document.addEventListener('visibilitychange', function () {
            var v = vids[live];
            if (document.hidden) { if (!v.paused) { v.pause(); v._wasPlaying = true; } }
            else if (v._wasPlaying) { v._wasPlaying = false; tryPlay(v); }
        });

        /* ---- boot ---- */
        /* the muted attribute isn't reliably reflected to the property — set it */
        vids.forEach(function (v) { v.muted = true; });
        var first = clip(0);
        vids[0].poster = first.poster;
        vids[0].src    = first.src;
        vids[0].classList.add('live');
        setMuteUi();
        updateHud();

        if (reducedMotion) {
            /* respect the setting: paint the poster, wait for the tap */
            overlay.classList.add('show');
            setPlayUi(false);
        } else {
            tryPlay(vids[0]);
        }
        preloadStandby();
    })();
    </script>

</body>
</html>
